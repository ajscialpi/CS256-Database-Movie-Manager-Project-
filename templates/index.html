<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MovieVault</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}">
</head>
<body>
    <header>
        <p>Movie Vault</p>
    </header>

    <main>
        <h1>Movie Vault</h1>
        <h2>PostgreSQL Practice Records</h2>
        <p>These movie records are retrieved from my PostgreSQL database using Flask and Python.</p>

        <section class="cards" aria-label="Records">
            {% for row in rows %}
            <article class="card">
                <h2>{{ row.title }}</h2>
                <p>{{ row.category }}</p>
            </article>
            {% else %}
            <p>No matching records yet.</p>
            {% endfor %}
        </section>
    </main>
</body>
</html>
