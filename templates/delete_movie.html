<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Movie | MovieVault</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}">
</head>
<body>
    <main>
        <h1>Delete Movie</h1>
        <p>Movie ID: {{ movie.movie_id }}</p>
        <h2>{{ movie.title }}</h2>
        <p>Are you sure you want to delete this movie? This cannot be undone.</p>
        {% if message %}
        <p class="field-error" role="alert">{{ message }}</p>
        <p><a href="{{ url_for('movie_detail', movie_id=movie.movie_id) }}">Open the latest movie</a></p>
        {% endif %}
        <form method="post" action="{{ url_for('confirm_delete_movie', movie_id=movie.movie_id) }}">
            <input type="hidden" name="version" value="{{ version }}">
            <div class="actions">
                <button type="submit" name="confirm" value="yes">Delete movie</button>
                <a href="{{ url_for('movie_detail', movie_id=movie.movie_id) }}">Cancel</a>
            </div>
        </form>
    </main>
</body>
</html>
